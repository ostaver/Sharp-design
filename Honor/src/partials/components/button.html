<div data-variant="{{variant}}" class="btn-fill v-{{variant}}">
  <div class="btn-fill-bg v-{{variant}}"></div>
  <div class="btn-fill-label v-{{variant}}">
    <div class="btn-fill-label-inner label-top v-{{variant}}">
      <div class="txt txt-font-mono txt-14">{{label}}</div>
    </div>
    <div class="btn-fill-label-inner label-bot v-{{variant}}" aria-hidden="true">
      <div class="txt txt-font-mono txt-14">{{label}}</div>
    </div>
  </div>
  <div class="btn-fill-icon v-{{variant}}" aria-hidden="true">
    <div class="btn-fill-icon-inner icon-top v-{{variant}}">
      <div class="btn-fill-icon-svg"><div class="embed-ic w-embed"><include src="icons/arrow-right"></include></div></div>
    </div>
    <div class="btn-fill-icon-inner icon-bot v-{{variant}}">
      <div class="btn-fill-icon-svg"><div class="embed-ic w-embed"><include src="icons/arrow-right"></include></div></div>
    </div>
  </div>
</div>
